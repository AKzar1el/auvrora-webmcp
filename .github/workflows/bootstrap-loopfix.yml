name: Bootstrap reviewed LoopFix source

on:
  push:
    branches:
      - feat/loopfix-webmcp

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Restore reviewed source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part* | base64 --decode > /tmp/loopfix-bootstrap.tar.gz
          tar -xzf /tmp/loopfix-bootstrap.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/ci.yml

      - name: Align current WebMCP, Worker, and browser contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts['generate:types'] = 'wrangler types';
          pkg.scripts.check = 'wrangler types --check && astro check';
          pkg.devDependencies.typescript = '6.0.3';
          pkg.devDependencies['@types/node'] = '22.20.1';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const tsconfig = JSON.parse(fs.readFileSync('tsconfig.json', 'utf8'));
          tsconfig.compilerOptions.types = ['./worker-configuration.d.ts', 'webmcp-types', 'node'];
          fs.writeFileSync('tsconfig.json', JSON.stringify(tsconfig, null, 2) + '\n');

          const wrangler = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          wrangler.main = '@astrojs/cloudflare/entrypoints/server';
          wrangler.compatibility_flags = [...new Set([...(wrangler.compatibility_flags || []), 'global_fetch_strictly_public'])];
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(wrangler, null, 2) + '\n');

          fs.writeFileSync('astro.config.mjs', `import { defineConfig } from "astro/config";\nimport cloudflare from "@astrojs/cloudflare";\n\nexport default defineConfig({\n  output: "server",\n  session: false,\n  adapter: cloudflare({\n    imageService: "passthrough",\n  }),\n});\n`);

          const replaceExact = (path, before, after) => {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`Expected source fragment missing in ${path}`);
            fs.writeFileSync(path, source.replace(before, after));
          };

          replaceExact(
            'src/lib/webmcp/register.ts',
            'tool as ModelContextTool',
            'tool as WebMCP.ModelContextTool',
          );

          replaceExact(
            'src/scripts/loopfix-client.ts',
            'import { registerLoopFixTools } from "../lib/webmcp/register.ts";\n\n',
            'import { registerLoopFixTools } from "../lib/webmcp/register.ts";\n\nfunction appendElements(parent: Node, ...children: Node[]) {\n  for (const child of children) parent.appendChild(child);\n}\n\n',
          );
          replaceExact(
            'src/scripts/loopfix-client.ts',
            'function setText(element: Element, value: string) {\n  element.textContent = value;\n}\n\n',
            '',
          );

          const clientPath = 'src/scripts/loopfix-client.ts';
          let client = fs.readFileSync(clientPath, 'utf8');
          const replacements = [
            ['top.append(severity, code);', 'appendElements(top, severity, code);'],
            ['body.append(top, title, evidence);', 'appendElements(body, top, title, evidence);'],
            ['label.append(checkbox, body);', 'appendElements(label, checkbox, body);'],
            ['counts.append(badge);', 'counts.appendChild(badge);'],
            ['findingsList.append(findingRow(', 'findingsList.appendChild(findingRow('],
            ['findingsList.append(empty);', 'findingsList.appendChild(empty);'],
            ['text.append(title, code);', 'appendElements(text, title, code);'],
            ['item.append(text, remove);', 'appendElements(item, text, remove);'],
            ['scopeList.append(item);', 'scopeList.appendChild(item);'],
            ['row.append(title, status);', 'appendElements(row, title, status);'],
            ['verificationList.append(row);', 'verificationList.appendChild(row);'],
          ];
          for (const [before, after] of replacements) {
            if (!client.includes(before)) throw new Error(`Expected client fragment missing: ${before}`);
            client = client.split(before).join(after);
          }
          fs.writeFileSync(clientPath, client);

          replaceExact(
            'test/fetch-public-page.test.ts',
            '    }) as typeof setTimeout;',
            '    }) as unknown as typeof setTimeout;',
          );

          replaceExact(
            'test/controller.test.ts',
            '      assert.ok(error instanceof Error);\n      assert.equal(error.message, "That target is not public.");',
            '      if (!(error instanceof Error)) return false;\n      assert.equal(error.message, "That target is not public.");',
          );

          replaceExact(
            'test/webmcp-tools.test.ts',
            'import type { VerificationResult } from "../src/lib/app/verification.ts";\n',
            '',
          );
          replaceExact(
            'test/webmcp-tools.test.ts',
            '      assert.ok(error instanceof Error);\n      assert.ok(error.message.length <= 220);',
            '      if (!(error instanceof Error)) return false;\n      assert.ok(error.message.length <= 220);',
          );
          NODE

      - name: Generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Worker runtime and binding types
        run: npm run generate:types

      - name: Verify typecheck, tests, and Worker build
        run: npm run verify

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: build LoopFix WebMCP challenge app"
          git push origin HEAD:feat/loopfix-webmcp
