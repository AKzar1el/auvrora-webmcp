name: Bootstrap reviewed LoopFix source

on:
  push:
    branches:
      - feat/loopfix-webmcp

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Restore reviewed source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part* | base64 --decode > /tmp/loopfix-bootstrap.tar.gz
          tar -xzf /tmp/loopfix-bootstrap.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-loopfix.yml

      - name: Generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Verify typecheck, tests, and Worker build
        run: npm run verify

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: build LoopFix WebMCP challenge app"
          git push origin HEAD:feat/loopfix-webmcp
