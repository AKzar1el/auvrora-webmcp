name: Deploy Worker

on:
  workflow_dispatch:
  push:
    branches:
      - deploy

permissions:
  contents: read

concurrency:
  group: auvrora-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WORKER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN_WORKER repository secret is not configured." >&2
            exit 1
          fi
          account_id="$(
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              https://api.cloudflare.com/client/v4/accounts \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); items=data.get("result") or []; assert data.get("success") and len(items)==1, "expected exactly one accessible Cloudflare account"; print(items[0]["id"])'
          )"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Verify and deploy
        run: npm run deploy
