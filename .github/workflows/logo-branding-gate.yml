name: Logo Branding Gate

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  branding:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - name: Verify logo and favicon wiring
        run: |
          test -f public/auvrora-mark.svg
          test -f public/favicon.svg
          grep -F 'src="/auvrora-mark.svg"' src/pages/index.astro
          grep -F 'rel="icon" type="image/svg+xml" href="/favicon.svg"' src/pages/index.astro
