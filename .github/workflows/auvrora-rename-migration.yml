name: Auvrora rename migration

on:
  push:
    branches: [feat/auvrora-rename]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout rename branch
        uses: actions/checkout@v6
        with:
          ref: feat/auvrora-rename
          fetch-depth: 0

      - name: Rename brand-specific paths
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            target="${path//loopfix/auvrora}"
            git mv "$path" "$target"
          done < <(find src docs evals -depth -name '*loopfix*' -print0)

      - name: Replace brand references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          allowed = {'.astro', '.css', '.html', '.js', '.json', '.jsonc', '.md', '.mjs', '.ts', '.yml', '.yaml'}
          excluded = {
              Path('test/brand-consistency.test.ts'),
              Path('.github/workflows/auvrora-rename-migration.yml'),
          }
          skip_parts = {'.git', 'node_modules', 'dist'}

          for path in root.rglob('*'):
              if not path.is_file() or path in excluded or any(part in skip_parts for part in path.parts):
                  continue
              if path.suffix.lower() not in allowed and path.name not in {'README.md', 'package-lock.json'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace('LOOPFIX', 'AUVRORA').replace('LoopFix', 'Auvrora').replace('loopfix', 'auvrora')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify rename completeness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('src'), Path('docs'), Path('evals')]
          root_files = [Path('README.md'), Path('package.json'), Path('package-lock.json'), Path('wrangler.jsonc')]
          stale = ('LoopFix', 'loopfix-webmcp', 'AKzar1el/loopfix-mcp', 'loopfix-client')
          offenders = []
          files = list(root_files)
          for root in roots:
              files.extend(path for path in root.rglob('*') if path.is_file())
          for path in files:
              if any(token.lower() in str(path).lower() for token in stale):
                  offenders.append(str(path))
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if any(token.lower() in text.lower() for token in stale):
                  offenders.append(str(path))
          if offenders:
              raise SystemExit('stale brand references: ' + ', '.join(sorted(set(offenders))))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Build Worker
        run: npm run build

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/auvrora-rename-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: rename LoopFix to Auvrora"
          git push origin HEAD:feat/auvrora-rename
