name: Deploy Branding Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-branding-once.yml

permissions:
  contents: read

concurrency:
  group: auvrora-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-branding]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WORKER }}
      LIVE_URL: https://auvrora-webmcp.tomi-seregi99.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN_WORKER repository secret is not configured." >&2
            exit 1
          fi
          account_id="$(
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              https://api.cloudflare.com/client/v4/accounts \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); items=data.get("result") or []; assert data.get("success") and len(items)==1, "expected exactly one accessible Cloudflare account"; print(items[0]["id"])'
          )"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Verify and deploy
        run: npm run deploy

      - name: Verify live branding
        shell: bash
        run: |
          set -euo pipefail
          cache_bust="branding-${GITHUB_SHA}"
          page="$(curl --fail --silent --show-error "${LIVE_URL}/?v=${cache_bust}")"
          grep -F 'src="/auvrora-mark.svg"' <<<"${page}"
          grep -F 'rel="icon" type="image/svg+xml" href="/favicon.svg"' <<<"${page}"
          mark="$(curl --fail --silent --show-error "${LIVE_URL}/auvrora-mark.svg?v=${cache_bust}")"
          favicon="$(curl --fail --silent --show-error "${LIVE_URL}/favicon.svg?v=${cache_bust}")"
          grep -F '<svg' <<<"${mark}"
          grep -F 'viewBox="0 0 64 64"' <<<"${favicon}"

# one-time trigger: 2026-09-04
