name: Deploy Branding Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-branding-once.yml

permissions:
  contents: read

concurrency:
  group: auvrora-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-branding]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and deploy
        run: npm run deploy
